<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掌中書｜拍照看手相</title>
<meta name="description" content="拍一張手掌照片，看看傳統手相怎麼解讀你的掌紋。娛樂用途。">
<meta name="theme-color" content="#1E2A44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="掌中書">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4ECE6;      /* 青瓷 */
  --panel:#F3F7F3;
  --ink:#1E2A44;        /* 藍墨 */
  --ink-soft:#52607A;
  --rule:#B9C7BE;
  --gold:#8F6B1F;       /* 掌紋金 */
  --seal:#A8281F;       /* 印泥，只用在印章 */
  --focus:#1E2A44;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141C2E; --panel:#1C2740; --ink:#E6ECE4; --ink-soft:#A4B0C4;
    --rule:#34415E; --gold:#D4B261; --seal:#E0685C; --focus:#E6ECE4;
  }
}
:root[data-theme="dark"]{
  --paper:#141C2E; --panel:#1C2740; --ink:#E6ECE4; --ink-soft:#A4B0C4;
  --rule:#34415E; --gold:#D4B261; --seal:#E0685C; --focus:#E6ECE4;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.75;
}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:700;margin:0}
h1{font-size:2.6rem;line-height:1.15;letter-spacing:.12em}
.lede{margin:.6rem 0 0;color:var(--ink-soft);max-width:22em}

/* 掌圖 */
.chart{display:block;width:100%;max-width:19rem;margin:1.5rem 0 1.25rem;height:auto}
.chart .palm{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.chart .line{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
.chart .l2{animation-delay:.25s}.chart .l3{animation-delay:.5s}.chart .l4{animation-delay:.75s}
.chart text{font-family:"Noto Serif TC","Songti TC",serif;font-size:13px;fill:var(--ink)}
.chart .seal rect{fill:none;stroke:var(--seal);stroke-width:2}
.chart .seal text{fill:var(--seal);font-size:13px;font-weight:700}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.chart .line{animation:none;stroke-dashoffset:0}}

/* 控制項 */
.row{display:flex;flex-wrap:wrap;gap:.6rem}
button,.btn{
  font:inherit;font-weight:500;cursor:pointer;border-radius:2px;
  padding:.7rem 1.1rem;min-height:2.9rem;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;
}
.primary{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.btn:focus-within,input[type=radio]:focus-visible+span{outline:2px solid var(--focus);outline-offset:3px}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
.btn{position:relative}

fieldset{border:0;padding:0;margin:1.25rem 0 0}
legend{padding:0;font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;margin-bottom:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-block;padding:.35rem .9rem;border:1.5px solid var(--rule);border-radius:999px;cursor:pointer}
.chips input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--paper)}

.consent{display:flex;gap:.6rem;align-items:flex-start;margin-top:1.5rem;cursor:pointer}
.consent input{width:1.25rem;height:1.25rem;margin-top:.3rem;accent-color:var(--ink);flex:none}
.preview{margin-top:1.5rem;display:none}
.preview img{display:block;max-width:100%;max-height:22rem;border:1.5px solid var(--ink);border-radius:2px}
.tips{margin:1.25rem 0 0;padding-left:1.2em;color:var(--ink-soft)}
.tips li{margin:.15rem 0}
.status{margin-top:1rem;min-height:1.75em;color:var(--ink-soft)}
.status.err{color:var(--seal)}

/* 結果 */
#result{margin-top:2rem;display:none}
#result h2{font-size:1.5rem;letter-spacing:.08em;padding-bottom:.5rem;border-bottom:1.5px solid var(--ink)}
.item{padding:1.1rem 0;border-bottom:1px solid var(--rule)}
.item h3{font-size:1.15rem;color:var(--gold);letter-spacing:.06em}
.item p{margin:.45rem 0 0}
.item .seen{color:var(--ink-soft)}
.item .seen::before{content:"照片上看到的：";font-weight:500;color:var(--ink)}
.item .trad::before{content:"傳統說法：";font-weight:500}
.summary{padding:1.1rem 0}
.summary p{margin:.45rem 0 0}
.note{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);font-size:.875rem;color:var(--ink-soft)}
.note p{margin:.3rem 0}
</style>
</head>
<body>
<main>
  <h1>掌中書</h1>
  <p class="lede">拍一張手掌的照片，看看傳統手相怎麼解讀你的掌紋。</p>

  <svg class="chart" viewBox="0 0 300 250" role="img" aria-label="手掌四條主要掌紋的位置示意圖">
    <path class="palm" d="M58 28 Q150 6 236 30 Q262 110 244 206 Q150 240 62 214 Q22 180 26 128 Q30 70 58 28Z"/>
    <path class="line l1" pathLength="1" d="M232 82 Q170 60 96 70 Q78 72 70 62"/>
    <path class="line l2" pathLength="1" d="M52 104 Q110 96 150 118 Q190 140 222 148"/>
    <path class="line l3" pathLength="1" d="M56 100 Q112 118 118 168 Q120 196 108 218"/>
    <path class="line l4" pathLength="1" d="M150 222 Q156 160 160 96"/>
    <text x="176" y="54">感情線</text>
    <text x="196" y="170">智慧線</text>
    <text x="54" y="176">生命線</text>
    <text x="166" y="208">命運線</text>
    <g class="seal" transform="translate(250 14)"><rect width="36" height="36" rx="2"/><text x="5" y="16">掌</text><text x="19" y="16">中</text><text x="12" y="31">書</text></g>
  </svg>

  <div class="row">
    <label class="btn primary">拍攝手掌
      <input id="cam" type="file" accept="image/*" capture="environment">
    </label>
    <label class="btn">從相簿選照片
      <input id="pick" type="file" accept="image/*">
    </label>
  </div>

  <ul class="tips" id="tips">
    <li>手掌攤平、五指自然張開，整隻手掌入鏡</li>
    <li>在明亮處拍攝，避免陰影蓋住掌紋</li>
  </ul>

  <div class="preview" id="preview">
    <img id="photo" alt="你選擇的手掌照片">

    <fieldset>
      <legend>這是哪一隻手</legend>
      <div class="chips">
        <label><input type="radio" name="hand" value="左手" checked><span>左手</span></label>
        <label><input type="radio" name="hand" value="右手"><span>右手</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>想多了解哪一面</legend>
      <div class="chips">
        <label><input type="radio" name="focus" value="整體" checked><span>整體</span></label>
        <label><input type="radio" name="focus" value="感情與人際"><span>感情與人際</span></label>
        <label><input type="radio" name="focus" value="工作與事業"><span>工作與事業</span></label>
        <label><input type="radio" name="focus" value="個性與思考方式"><span>個性與思考</span></label>
      </div>
    </fieldset>

    <label class="consent"><input type="checkbox" id="agree"><span>我同意將這張照片傳送給 AI 服務進行本次解讀</span></label>

    <div class="row" style="margin-top:1rem">
      <button class="primary" id="read" disabled>解讀掌紋</button>
      <button id="stop" hidden>停止</button>
    </div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section id="result" aria-live="polite">
    <h2>你的掌紋解讀</h2>
    <div id="items"></div>
    <div class="summary" id="summary"></div>
  </section>

  <div class="note">
    <p>手相屬於傳統文化與娛樂內容，沒有科學證據支持它能預測未來。請不要把解讀結果當成醫療、財務或人生重大決定的依據。</p>
    <p>照片只會在你同意後傳送給 AI 服務做這一次解讀，本服務不會儲存照片。</p>
  </div>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  // 後端網址：與網頁同一主機時用相對路徑；若網頁放在 GitHub Pages，請改成後端的完整網址
  var API_URL = "/api/read-palm";
  var file = null, busy = false, ctl = null, objUrl = null;
  var statusEl = $("status"), readBtn = $("read"), stopBtn = $("stop"), agree = $("agree");

  function say(msg, isErr){
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (isErr ? " err" : "");
  }
  function refresh(){ readBtn.disabled = !(file && agree.checked) || busy; }
  agree.addEventListener("change", refresh);

  function onFile(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    file = f;
    if(objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(f);
    $("photo").src = objUrl;
    $("preview").style.display = "block";
    $("tips").style.display = "none";
    $("result").style.display = "none";
    say("");
    refresh();
    e.target.value = "";
  }
  $("cam").addEventListener("change", onFile);
  $("pick").addEventListener("change", onFile);

  function picked(name){
    var el = document.querySelector('input[name="' + name + '"]:checked');
    return el ? el.value : "";
  }

  // 送出前先在手機上縮圖成 JPEG，縮短上傳與解讀時間
  function shrink(f){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        var max = 1280, w = img.naturalWidth, h = img.naturalHeight;
        var k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        var url = c.toDataURL("image/jpeg", 0.85);
        resolve(url.split(",")[1]);
      };
      img.onerror = function(){ reject(new Error("image")); };
      img.src = URL.createObjectURL(f);
    });
  }

  function addItem(parent, title, seen, trad){
    var d = document.createElement("div"); d.className = "item";
    var h = document.createElement("h3"); h.textContent = title; d.appendChild(h);
    if(seen){ var p1 = document.createElement("p"); p1.className = "seen"; p1.textContent = seen; d.appendChild(p1); }
    if(trad){ var p2 = document.createElement("p"); p2.className = "trad"; p2.textContent = trad.replace(/^傳統手相認為[，,：:]?/, ""); d.appendChild(p2); }
    parent.appendChild(d);
  }

  function render(data){
    var items = $("items"), sum = $("summary");
    items.textContent = ""; sum.textContent = "";
    var hs = data.handShape;
    if(hs && (hs.observation || hs.reading)){
      addItem(items, "手型" + (hs.type ? "｜" + String(hs.type) : ""), String(hs.observation || ""), String(hs.reading || ""));
    }
    (Array.isArray(data.lines) ? data.lines : []).forEach(function(l){
      if(!l || !l.name) return;
      addItem(items, String(l.name), String(l.observation || ""), String(l.reading || ""));
    });
    if(data.summary){
      var h = document.createElement("h3"); h.textContent = "整體來看"; sum.appendChild(h);
      var p = document.createElement("p"); p.textContent = String(data.summary); sum.appendChild(p);
    }
    $("result").style.display = "block";
    $("result").scrollIntoView({behavior:"smooth", block:"start"});
  }

  var COPY = {
    too_large: "照片檔案太大，請重新拍攝或換一張照片。",
    bad_image: "這張照片無法讀取，請換一張 JPEG 或 PNG 照片。",
    busy: "目前使用人數較多，請稍後再解讀。",
    not_configured: "解讀服務尚未接上後端，目前只能預覽畫面。",
    upstream: "AI 服務暫時沒有回應，請稍後再按一次「解讀掌紋」。",
    bad_output: "這次解讀的格式不完整，請再按一次「解讀掌紋」。"
  };

  readBtn.addEventListener("click", async function(){
    if(!file || busy || !agree.checked) return;
    busy = true; ctl = new AbortController();
    stopBtn.hidden = false; refresh();
    $("result").style.display = "none";
    say("正在解讀掌紋，大約需要半分鐘……");
    try{
      var b64;
      try{ b64 = await shrink(file); }
      catch(e){ throw {code:"bad_image"}; }
      var res = await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({image: b64, hand: picked("hand"), focus: picked("focus")}),
        signal: ctl.signal
      });
      var data = await res.json().catch(function(){ return null; });
      if(res.status === 404 || res.status === 405){ throw {code:"not_configured"}; }
      if(!res.ok || !data){ throw {code: (data && data.error) || "upstream"}; }
      if(data.valid === false){
        say(String(data.reason || "這張照片看不清楚掌紋，請在明亮處重新拍攝整隻手掌。"), true);
      }else{
        say("");
        render(data);
      }
    }catch(e){
      if(e && e.name === "AbortError"){ say("已停止解讀。"); }
      else{ say(COPY[e && e.code] || "解讀時連線中斷，請確認網路後再按一次「解讀掌紋」。", true); }
    }finally{
      busy = false; ctl = null; stopBtn.hidden = true; refresh();
    }
  });
  stopBtn.addEventListener("click", function(){ if(ctl) ctl.abort(); });
})();
</script>
</body>
</html>
